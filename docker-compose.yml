services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: receng
      POSTGRES_PASSWORD: receng
      POSTGRES_DB: receng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receng"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=receng;Username=receng;Password=receng"
    volumes:
      - ./devAssets:/devAssets:ro
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
