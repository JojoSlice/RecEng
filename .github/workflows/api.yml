name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "api.Tests/**"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "api.Tests/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test api.Tests --no-build
